version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Vercel's build step for the API (@vercel/backends) crashes with TypeScript 7
      # ("Cannot read properties of undefined (reading 'readFile')"). Revisit when it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint-plugin-import, jsx-a11y and react (from eslint-config-next) support ESLint 9 at most.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Keep the Node typings on the Node version we run (24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /packages/sdk-python
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
