[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fiscallm"
version = "0.3.0"
description = "Track AI cost per user against subscription revenue. Zero-dependency SDK for your backend."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []
keywords = ["ai", "llm", "cost", "revenuecat", "openai", "anthropic", "gemini"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://fiscallm.com"
Documentation = "https://fiscallm.com/docs"
Source = "https://github.com/magna56/ai_spend_book"

[tool.hatch.build.targets.wheel]
packages = ["src/fiscallm"]
